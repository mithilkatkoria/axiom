[package]
name = "axiom-engine"
version = "1.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Axiom lexer, parser, type checker, bytecode compiler and bounded debugger VM."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["unbounded_depth"] }
ryu-js = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
